<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Post - MyBlog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="nav-container">

        <a class="logo" href="{{ url_for('home') }}">
            MyBlog
        </a>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">Home</a>

            <a href="{{ url_for('posts') }}">Posts</a>

            <a href="{{ url_for('logout') }}">Logout</a>

        </div>

    </div>

</nav>


<main class="container">

    <div class="form-container">

        <h1>Create New Post ✍️</h1>

        <form method="POST">

            <div class="form-group">

                <label for="title">
                    Post Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    placeholder="Enter your post title"
                    maxlength="200"
                    required
                >

            </div>


            <div class="form-group">

                <label for="content">
                    Content
                </label>

                <textarea
                    id="content"
                    name="content"
                    rows="12"
                    placeholder="Write your story or thoughts..."
                    required
                ></textarea>

            </div>


            <button class="btn" type="submit">
                Publish Post
            </button>

            <a class="btn btn-secondary"
               href="{{ url_for('posts') }}">
                Cancel
            </a>

        </form>

    </div>

</main>


<footer class="footer">

    <p>
        © 2026 MyBlog. Built with Flask.
    </p>

</footer>

</body>
</html>
