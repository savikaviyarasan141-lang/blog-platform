<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Comment - MyBlog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <div class="nav-container">

        <a class="logo"
           href="{{ url_for('home') }}">

            MyBlog

        </a>


        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('posts') }}">
                Posts
            </a>

            {% if current_user.is_authenticated %}

                <a href="{{ url_for('create_post') }}">
                    Create Post
                </a>

                <a href="{{ url_for('logout') }}">
                    Logout
                </a>

            {% else %}

                <a href="{{ url_for('login') }}">
                    Login
                </a>

                <a href="{{ url_for('register') }}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>

</nav>


<!-- ================= MAIN CONTENT ================= -->

<main class="container">

    <section class="form-container">


        <!-- ================= PAGE HEADER ================= -->

        <div class="page-header">

            <div>

                <span class="section-label">
                    EDIT COMMENT
                </span>

                <h1>
                    Update Your Comment
                </h1>

                <p>
                    Make changes to your comment and save them.
                </p>

            </div>

        </div>


        <!-- ================= EDIT FORM ================= -->

        <form
            method="POST"
            action="{{ url_for('edit_comment', comment_id=comment.id) }}">


            <div class="form-group">

                <label for="content">
                    Your Comment
                </label>


                <textarea
                    id="content"
                    name="content"
                    rows="7"
                    required>{{ comment.content }}</textarea>

            </div>


            <!-- ================= FORM ACTIONS ================= -->

            <div class="form-actions">

                <button
                    type="submit"
                    class="btn">

                    Save Changes

                </button>


                <a
                    href="{{ url_for('view_post', post_id=comment.post_id) }}"
                    class="btn btn-secondary">

                    Cancel

                </a>

            </div>


        </form>

    </section>

</main>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    <p>
        © 2026 MyBlog. Built with Flask, MySQL & REST APIs.
    </p>

</footer>


</body>

</html>
