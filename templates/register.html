<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - MyBlog</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">

    <div class="nav-container">

        <a class="logo" href="{{ url_for('home') }}">
            MyBlog
        </a>

        <div class="nav-links">

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('posts') }}">
                Posts
            </a>

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</nav>


<main class="container">

    <div class="form-container">

        <h1>Create Account</h1>


        {% with messages = get_flashed_messages() %}

            {% for message in messages %}

                <div class="flash">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form method="POST">

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Choose a username"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button class="btn" type="submit">
                Register
            </button>

        </form>


        <p style="margin-top: 20px; text-align: center;">

            Already have an account?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </p>

    </div>

</main>


<footer class="footer">

    <p>© 2026 MyBlog. Built with Flask.</p>

</footer>

</body>
</html>
